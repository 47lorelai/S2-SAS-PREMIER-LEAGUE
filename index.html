<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06101a">
<title>SAS Premier League Season 2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>

<header class="topbar">
  <button class="brand" data-page="home">
    <span class="crown">♛</span>
    <span>SAS <small>PREMIER LEAGUE</small><b>SEASON 2</b></span>
  </button>
  <button class="hamb" id="hamb">☰</button>
  <nav id="nav">
    <button class="nav active" data-page="home">⌂ <span>Home</span></button>
    <button class="nav" data-page="table">🏆 <span>League Table</span></button>
    <button class="nav" data-page="fixtures">📅 <span>Fixtures</span></button>
    <button class="nav" data-page="results">⚽ <span>Results</span></button>
    <button class="nav" data-page="teams">👥 <span>Teams</span></button>
    <button class="nav" data-page="stats">📊 <span>Statistics</span></button>
    <button class="nav" data-page="gallery">▣ <span>Gallery</span></button>
    <button class="nav" data-page="about">ⓘ <span>About</span></button>
  </nav>
  <div class="status"><i></i><span id="last">Loading…</span></div>
</header>

<main id="app"></main>

<footer>
  <strong>SAS PREMIER LEAGUE SEASON 2</strong>
  <span>⚽ Bola • Persahabatan • Kita • Bersama</span>
  <span>© 2026</span>
</footer>

  <div class="mobileBottomNav" id="mobileBottomNav" aria-label="Navigasi mudah alih">
    <button class="mobileNav active" data-page="home"><span>⌂</span><small>Home</small></button>
    <button class="mobileNav" data-page="table"><span>🏆</span><small>Table</small></button>
    <button class="mobileNav" data-page="fixtures"><span>📅</span><small>Fixtures</small></button>
    <button class="mobileNav" data-page="results"><span>⚽</span><small>Results</small></button>
    <button class="mobileNav" data-page="teams"><span>👥</span><small>Teams</small></button>
  </div>

<script>
const SHEET_ID = "11Gei543GpeBvto9r85b47w1Apa88btyCfYAoVaafU1U";
const RESULTS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=RESULTS`;
const SCOREBOARD_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=SCOREBOARD`;

const TEAMS = ["SAS FC","SABAH FC","LANGGAR FC","TANGKI FC","T-REX NAZARIO"];
const LOGOS = {
  "SAS FC":"assets/teams/sas-fc.png",
  "SABAH FC":"assets/teams/sabah-fc.png",
  "LANGGAR FC":"assets/teams/langgar-fc.png",
  "TANGKI FC":"assets/teams/tangki-fc.png",
  "T-REX NAZARIO":"assets/teams/trex-nazario.png"
};

const OFFICIAL_FIXTURES = [["MD1", "SAS FC", "TANGKI FC"], ["MD1", "SABAH FC", "LANGGAR FC"], ["MD2", "LANGGAR FC", "SAS FC"], ["MD2", "T-REX NAZARIO", "TANGKI FC"], ["MD3", "SAS FC", "SABAH FC"], ["MD3", "LANGGAR FC", "T-REX NAZARIO"], ["MD4", "TANGKI FC", "SABAH FC"], ["MD4", "T-REX NAZARIO", "SAS FC"], ["MD5", "SABAH FC", "T-REX NAZARIO"], ["MD5", "TANGKI FC", "LANGGAR FC"], ["MD6", "TANGKI FC", "SAS FC"], ["MD6", "LANGGAR FC", "SABAH FC"], ["MD7", "SAS FC", "LANGGAR FC"], ["MD7", "TANGKI FC", "T-REX NAZARIO"], ["MD8", "SABAH FC", "SAS FC"], ["MD8", "T-REX NAZARIO", "LANGGAR FC"], ["MD9", "SABAH FC", "TANGKI FC"], ["MD9", "SAS FC", "T-REX NAZARIO"], ["MD10", "T-REX NAZARIO", "SABAH FC"], ["MD10", "LANGGAR FC", "TANGKI FC"]];

let rows = [];
let scoreRows = [];
let page = "home";

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
function logo(t){
  return `<img class="logo" src="${LOGOS[t] || ""}" alt="${esc(t)}">`;
}
function parseCSV(text){
  let out=[],row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],n=text[i+1];
    if(ch==='"'&&q&&n==='"'){cell+='"';i++;continue}
    if(ch==='"'){q=!q;continue}
    if(ch===','&&!q){row.push(cell.trim());cell="";continue}
    if((ch==='\n'||ch==='\r')&&!q){
      if(ch==='\r'&&n==='\n')i++;
      row.push(cell.trim());
      if(row.some(x=>x!==""))out.push(row);
      row=[];cell="";
      continue;
    }
    cell+=ch;
  }
  if(cell||row.length){row.push(cell.trim());out.push(row)}
  return out;
}
function normalize(r){
  return {md:r[0]||"",home:r[1]||"",away:r[2]||"",hs:r[3]||"",as:r[4]||""};
}
function normalizeScore(r){
  return {
    pos:r[0]||"",t:r[1]||"",
    mp:Number(r[2]||0),w:Number(r[3]||0),d:Number(r[4]||0),
    l:Number(r[5]||0),gf:Number(r[6]||0),ga:Number(r[7]||0),
    gd:Number(r[8]||0),pts:Number(r[9]||0)
  };
}
function completed(m){
  return m.home!==""&&m.away!==""&&m.hs!==""&&m.as!==""
    &&!isNaN(Number(m.hs))&&!isNaN(Number(m.as));
}
function officialFixtures(){
  // Google Sheet is the source for scores, while OFFICIAL_FIXTURES fixes
  // the exact league order used on the GitHub pages.
  const byPair=new Map(
    rows.map(normalize).map(m=>[
      `${String(m.home).trim().toUpperCase()}|${String(m.away).trim().toUpperCase()}`,m
    ])
  );
  return OFFICIAL_FIXTURES.map(f=>{
    const key=`${f[1].trim().toUpperCase()}|${f[2].trim().toUpperCase()}`;
    const m=byPair.get(key);
    return m
      ? {md:f[0],home:f[1],away:f[2],hs:m.hs,as:m.as}
      : {md:f[0],home:f[1],away:f[2],hs:"",as:""};
  });
}

function latestCompletedResult(){
  const matches=officialFixtures();
  for(let i=matches.length-1;i>=0;i--){
    if(completed(matches[i])) return matches[i];
  }
  return null;
}

function fallbackStandings(){
  const s=Object.fromEntries(TEAMS.map(t=>[t,{t,mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}]));
  rows.map(normalize).filter(completed).forEach(m=>{
    const h=s[m.home],a=s[m.away],x=+m.hs,y=+m.as;
    if(!h||!a)return;
    h.mp++;a.mp++;h.gf+=x;h.ga+=y;a.gf+=y;a.ga+=x;
    if(x>y){h.w++;h.pts+=3;a.l++}
    else if(x<y){a.w++;a.pts+=3;h.l++}
    else{h.d++;a.d++;h.pts++;a.pts++}
  });
  return Object.values(s).map(x=>({...x,gd:x.gf-x.ga}))
    .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}
function standings(){
  const s=scoreRows.map(normalizeScore).filter(x=>x.t);

  if(s.length===TEAMS.length){
    // Jangan bergantung kepada kolum POS atau susunan row SCOREBOARD.
    // Ranking dikira semula berdasarkan mata → GD → GF.
    s.sort((a,b)=>
      b.pts-a.pts ||
      b.gd-a.gd ||
      b.gf-a.gf ||
      b.w-a.w ||
      a.t.localeCompare(b.t)
    );
    return s.map((x,i)=>({...x,pos:i+1}));
  }

  return fallbackStandings().map((x,i)=>({...x,pos:i+1}));
}
function card(title,body,cls=""){
  return `<section class="card ${cls}"><h2>${title}</h2>${body}</section>`;
}
function fixtureCard(f,played=false){
  return `<div class="fixture">
    <span class="md">${esc(f.md)}</span>
    <div class="team">${logo(f.home)}<b>${esc(f.home)}</b></div>
    <strong>${played ? `${esc(f.hs)} - ${esc(f.as)}` : "VS"}</strong>
    <div class="team">${logo(f.away)}<b>${esc(f.away)}</b></div>
  </div>`;
}
function teamStats(t,s){
  return s.find(x=>x.t===t)||{mp:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0};
}
function render(){
  document.querySelectorAll(".nav,.mobileNav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  document.body.dataset.page=page;

  const s=standings();
  const matches=officialFixtures();
  const played=matches.filter(completed);
  const next=matches.find(m=>!completed(m));
    const latest=latestCompletedResult();
  const goals=played.reduce((n,m)=>n+Number(m.hs)+Number(m.as),0);

  let content="";

  if(page==="home"){
    const top=s[0];
    content=`<div class="hero">
      <img src="assets/hero.jpg"><div class="heroShade"></div>
      <div class="heroText">
        <div class="eyebrow">STADIUM JPPH SANDAKAN</div>
        <h1>SAS PREMIER LEAGUE <em>SEASON 2</em></h1>
        <p>Satu Liga • Satu Semangat</p>
      </div>
    </div>
    <div class="grid homegrid">
      ${card("🏆 LEAGUE TABLE",
        `<div class="miniTable">${s.map((x,i)=>`
          <div><span>${i+1}</span>${logo(x.t)}<b>${esc(x.t)}</b><strong>${x.pts} PTS</strong></div>
        `).join("")}</div>
        <button class="gold" data-page="table">LIHAT JADUAL PENUH →</button>`)}
      ${card("📅 NEXT FIXTURE",
        next ? fixtureCard(next,false) : `<div class="empty">Semua perlawanan telah selesai.</div>`
        + `<div class="matchnote">${next ? "Data diselaraskan daripada Google Sheets." : "20 perlawanan lengkap."}</div>`,
        "featured")}
      ${card("⚽ LATEST RESULTS",
        played.slice().reverse().slice(0,5).map(m=>`
          <div class="result"><span>${esc(m.md)}</span><b>${esc(m.home)}</b>
          <strong>${esc(m.hs)} - ${esc(m.as)}</strong><b>${esc(m.away)}</b></div>
        `).join("") || `<div class="empty">Belum ada keputusan.</div>`)}
    </div>`;
  }
  else if(page==="table"){
    content=`<div class="pagehead"><div>
      <span class="eyebrow">LIVE STANDINGS</span><h1>League Table</h1>
      <p>3 mata menang • 1 mata seri • 0 mata kalah</p>
    </div></div>
    ${card("🏆 SAS PREMIER LEAGUE SEASON 2",
      `<div class="tablewrap"><table><thead><tr>
        <th>#</th><th>TEAM</th><th>MP</th><th>W</th><th>D</th><th>L</th>
        <th>GF</th><th>GA</th><th>GD</th><th>PTS</th>
      </tr></thead><tbody>${s.map((x,i)=>`
        <tr><td><span class="rank">${i+1}</span></td>
        <td class="teamcell">${logo(x.t)}<b>${esc(x.t)}</b></td>
        <td>${x.mp}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td>
        <td>${x.gf}</td><td>${x.ga}</td><td>${x.gd}</td><td><strong>${x.pts}</strong></td></tr>
      `).join("")}</tbody></table></div>`)}
    <div class="notice">📡 Kedudukan rasmi dibaca daripada tab SCOREBOARD Google Sheets. Jika tab belum boleh dibaca, website menggunakan kiraan keputusan sebagai fallback.</div>`;
  }
  else if(page==="fixtures"){
    const grouped={};
    matches.forEach(m=>(grouped[m.md]??=[]).push(m));
    content=`<div class="pagehead"><div>
      <span class="eyebrow">20 MATCHES</span><h1>Fixtures</h1>
      <p>Double round-robin • setiap pasukan 8 perlawanan • 4 home + 4 away</p>
    </div></div>
    <div class="fixturegrid">${Object.entries(grouped).map(([md,ms])=>`
      <div class="card">
        <h2>${esc(md)}</h2>
        ${ms.map(m=>fixtureCard(m,completed(m))).join("")}
      </div>
    `).join("")}</div>`;
  }
  else if(page==="results"){
    content=`<div class="pagehead"><div>
      <span class="eyebrow">LIVE RESULTS</span><h1>Results</h1>
      <p>Keputusan yang telah dimasukkan ke Google Sheets</p>
    </div></div>
    <div class="resultsgrid">${played.slice().reverse().map(m=>`
      <div class="resultBig"><span>${esc(m.md)}</span>
        <div>${logo(m.home)}<b>${esc(m.home)}</b></div>
        <strong>${esc(m.hs)}<small> - </small>${esc(m.as)}</strong>
        <div>${logo(m.away)}<b>${esc(m.away)}</b></div>
      </div>
    `).join("") || `<div class="empty">Belum ada keputusan.</div>`}</div>`;
  }
  else if(page==="teams"){
    content=`<div class="pagehead"><div>
      <span class="eyebrow">THE CONTENDERS</span><h1>Teams</h1>
      <p>Lima pasukan • satu kejuaraan</p>
    </div></div>
    <div class="teamsgrid">${TEAMS.map(t=>{
      const x=teamStats(t,s);
      return `<article class="teamcard">${logo(t)}<h2>${esc(t)}</h2>
        <p>${t==="T-REX NAZARIO"?"Bigger • Stronger • Together":"Satu pasukan. Satu semangat."}</p>
        <small>${x.mp} MP • ${x.pts} PTS</small>
        <button data-page="table">LIHAT PRESTASI →</button>
      </article>`;
    }).join("")}</div>`;
  }
  else if(page==="stats"){
    const topPts=s[0]||{};
    const bestAttack=s.slice().sort((a,b)=>b.gf-a.gf)[0]||{};
    const bestDef=s.slice().sort((a,b)=>a.ga-b.ga)[0]||{};
    content=`<div class="pagehead"><div>
      <span class="eyebrow">SEASON INSIGHTS</span><h1>Statistics</h1>
      <p>Ringkasan live musim ini</p>
    </div></div>
    <div class="statgrid">
      ${[
        ["⚽",String(goals),"Goals"],
        ["🎮",String(played.length),"Matches Played"],
        ["🏆",String(TEAMS.length),"Teams"],
        ["🔥",String(topPts.pts||0),"Top Points"]
      ].map(x=>`<div class="statbox"><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join("")}
    </div>
    ${card("📈 TEAM LEADERS",
      `<div class="aboutlist">
        <div>⚡ <b>Best Attack</b><span>${esc(bestAttack.t||"-")} • ${bestAttack.gf||0} GF</span></div>
        <div>🛡️ <b>Best Defence</b><span>${esc(bestDef.t||"-")} • ${bestDef.ga||0} GA</span></div>
        <div>👑 <b>Current Leader</b><span>${esc(topPts.t||"-")} • ${topPts.pts||0} PTS</span></div>
        <div>📊 <b>Goal Difference</b><span>${esc(topPts.t||"-")} • ${topPts.gd||0} GD</span></div>
      </div>`)}
    `;
  }
  else if(page==="gallery"){
    content=`<div class="pagehead"><div>
      <span class="eyebrow">VISUALS</span><h1>Gallery</h1>
      <p>Identiti sinematik SAS Premier League Season 2</p>
    </div></div>
    <div class="gallery"><img src="assets/hero.jpg">
      <div class="gallerycopy"><h2>SATU LIGA • SATU SEMANGAT</h2><p>Stadium JPPH Sandakan</p></div>
    </div>`;
  }
  else {
    content=`<div class="pagehead"><div>
      <span class="eyebrow">ABOUT THE LEAGUE</span><h1>About</h1>
      <p>SAS Premier League Season 2</p>
    </div></div>
    <div class="about card">
      <h2>⚽ Football Unites Us</h2>
      <p>Web app premium ini memaparkan fixtures, keputusan, pasukan, statistik dan kedudukan liga berdasarkan Google Sheets.</p>
      <div class="aboutlist">
        <div>📡 <b>Sumber live</b><span>Google Sheets — RESULTS & SCOREBOARD</span></div>
        <div>🔄 <b>Auto refresh</b><span>Setiap 30 saat</span></div>
        <div>📱 <b>Responsive</b><span>Telefon, tablet & PC</span></div>
        <div>🆓 <b>Hosting</b><span>GitHub Pages</span></div>
      </div>
    </div>`;
  }

  document.getElementById("app").innerHTML=content;
  document.querySelectorAll("[data-page]").forEach(x=>x.onclick=()=>{
    page=x.dataset.page;
    document.getElementById("nav").classList.remove("open");
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  });
}

async function load(){
  try{
    const [resultsRes,scoreboardRes]=await Promise.all([
      fetch(RESULTS_URL+"&t="+Date.now(),{cache:"no-store"}),
      fetch(SCOREBOARD_URL+"&t="+Date.now(),{cache:"no-store"})
    ]);
    if(!resultsRes.ok) throw new Error("RESULTS fetch failed");
    rows=parseCSV(await resultsRes.text()).slice(1);
    scoreRows=scoreboardRes.ok ? parseCSV(await scoreboardRes.text()).slice(1) : [];
    document.getElementById("last").textContent="LIVE • "+new Date().toLocaleTimeString("ms-MY",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    document.getElementById("last").textContent="OFFLINE / SEMAK SHEET";
  }
  render();
}

document.getElementById("hamb").onclick=()=>document.getElementById("nav").classList.toggle("open");
load();
setInterval(load,30000);
</script>
</body>
</html>
